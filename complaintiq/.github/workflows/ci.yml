name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python: ["3.10", "3.12"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}", cache: pip }
      - run: pip install -e ".[dev,data]"
      - run: ruff check .
      - run: pytest -q
      - name: end-to-end smoke (synthetic)
        run: |
          python -m complaintiq synth --n 5000 --out data/synth.csv
          python -m complaintiq build --src data/synth.csv --sample 5000
          python -m complaintiq eval-retrieval --n-queries 50
          python -m complaintiq spikes --top 3
