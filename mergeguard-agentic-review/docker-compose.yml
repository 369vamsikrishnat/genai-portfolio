services:
  sandbox-volume-init:
    build: .
    command:
      - python
      - -c
      - "import os; from pathlib import Path; paths=[(Path('/sandbox/workspaces'),0o2771),(Path('/sandbox/requests'),0o2770),(Path('/sandbox/results'),0o2770)]; [(path.mkdir(parents=True,exist_ok=True),os.chown(path,0,2000),os.chmod(path,mode)) for path,mode in paths]"
    user: "0:0"
    network_mode: none
    volumes:
      - sandbox-workspaces:/sandbox/workspaces
      - sandbox-requests:/sandbox/requests
      - sandbox-results:/sandbox/results
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mergeguard
      POSTGRES_USER: mergeguard
      POSTGRES_PASSWORD: ${MERGEGUARD_DB_PASSWORD:-local-dev-change-me}
    volumes:
      - mergeguard-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mergeguard -d mergeguard"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: ${DATABASE_URL:-postgresql://mergeguard:${MERGEGUARD_DB_PASSWORD:-local-dev-change-me}@postgres:5432/mergeguard}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      WEBHOOK_API_KEY: ${MERGEGUARD_WEBHOOK_API_KEY:-local-dev-change-me}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_MIN_REQUEST_INTERVAL_SECONDS: ${GEMINI_MIN_REQUEST_INTERVAL_SECONDS:-1.0}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse:3000}
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  worker:
    build: .
    command: ["python", "-m", "mergeguard.worker"]
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: ${DATABASE_URL:-postgresql://mergeguard:${MERGEGUARD_DB_PASSWORD:-local-dev-change-me}@postgres:5432/mergeguard}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_MIN_REQUEST_INTERVAL_SECONDS: ${GEMINI_MIN_REQUEST_INTERVAL_SECONDS:-1.0}
      WEBHOOK_API_KEY: ${MERGEGUARD_WEBHOOK_API_KEY:-local-dev-change-me}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse:3000}
      SANDBOX_WORKSPACE_DIR: /sandbox/workspaces
      SANDBOX_REQUEST_DIR: /sandbox/requests
      SANDBOX_RESULT_DIR: /sandbox/results
    volumes:
      - sandbox-workspaces:/sandbox/workspaces
      - sandbox-requests:/sandbox/requests
      - sandbox-results:/sandbox/results
    group_add:
      - "2000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      sandboxed-runner:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  sandboxed-runner:
    build: .
    command: ["python", "-m", "mergeguard.sandbox.runner"]
    network_mode: none
    user: "0:0"
    volumes:
      - sandbox-workspaces:/sandbox/workspaces:ro
      - sandbox-requests:/sandbox/requests
      - sandbox-results:/sandbox/results
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    restart: unless-stopped
    depends_on:
      sandbox-volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert all(Path(p).is_dir() for p in ['/sandbox/workspaces', '/sandbox/requests', '/sandbox/results'])"]
      interval: 5s
      timeout: 3s
      retries: 10

  langfuse-db:
    image: postgres:16-alpine
    profiles: [observability]
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD:-local-dev-change-me}
    volumes:
      - langfuse-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 3s
      retries: 10

  langfuse:
    image: langfuse/langfuse:2
    profiles: [observability]
    environment:
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD:-local-dev-change-me}@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-local-dev-nextauth-secret-change-this}
      SALT: ${LANGFUSE_SALT:-local-dev-salt-change-this}
    ports:
      - "3000:3000"
    depends_on:
      langfuse-db:
        condition: service_healthy

volumes:
  redis-data:
  mergeguard-data:
  sandbox-workspaces:
  sandbox-requests:
  sandbox-results:
  langfuse-data: