[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mergeguard"
version = "0.9.0"
description = "Multi-agent GitHub pull-request review workflow with sandboxed tests and human approval."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0",
    "fastapi>=0.115.0",
    "google-genai>=2.25.0",
    "langgraph>=1.2.0",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langfuse>=2.0,<3",
    "mcp>=1.0,<2.0",
    "pip-audit>=2.9.0",
    "psycopg[binary]>=3.2.1",
    "pydantic>=2.0.0",
    "pytest>=8.0.0",
    "redis>=5.0.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --import-mode=importlib"
